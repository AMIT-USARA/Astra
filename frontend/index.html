    <meta name="twitter:card" content="summary" />

    <!-- Structured Data for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "astrACode — AI Resume Score Checker",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://astra-tau-two.vercel.app/",
            "description": "An AI-powered resume score checker that evaluates PDF and DOCX resumes out of 100 across 9 transparent criteria, computes TF-IDF job match, and provides AI recruiter feedback.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            },
            "featureList": [
              "0-100 explainable resume score across 9 criteria",
              "TF-IDF and cosine similarity job description match",
              "120+ technical & soft skill extraction",
              "OpenAI recruiter review and bullet rewrites",
              "Downloadable PDF analysis report"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "How is the resume score calculated?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The resume score is calculated out of 100 across 9 transparent criteria: Contact info (10), Structure (10), Skills (20), Education (10), Experience (15), Projects (10), Certifications (5), Impact & language (10), and Keyword relevance (10 when a job description is provided)."
                }
              },
              {
                "@type": "Question",
                "name": "Which resume file formats are supported?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Text-based PDF and DOCX files up to 5 MB are supported."
                }
              },
              {
                "@type": "Question",
                "name": "Is my uploaded resume file stored on disk?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Uploaded resume files are processed in memory and never saved to disk. Only the extracted analysis results are saved to your private account."
                }
              }
            ]
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var t = localStorage.getItem('arc_theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.querySelector('link[rel="icon"]')?.setAttribute('href', '/favicon-dark.svg');
        }
      })();
    </script>
